[workspace]
resolver = "2"
members = ["crates/node"]
# Patched copies of upstream crates: built as dependencies, not linted or
# tested as our own.
exclude = ["patches"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
ignore = "0.4"
# iroh is 1.x; the protocol crates are pre-1.0 with frequent breaking
# releases, so pin all four exactly and upgrade them together. RPC features are
# off: everything runs in one process.
iroh = "=1.3.0"
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }
iroh-docs = { version = "=0.101.0", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
n0-future = "0.3"
notify = "8"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# iroh-gossip 0.101.0 never redials a peer whose first dial failed; the copy
# in patches/ forgets such a peer so the next message dials it again. Remove
# once a release fixes it. See plans/sync-plan.md, step 6a.
[patch.crates-io]
iroh-gossip = { path = "patches/iroh-gossip" }
